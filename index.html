    <title>SMT Tech Gym</title>

    <div id="stage">
      <canvas id="screen" width="240" height="160"></canvas>
      <div id="overlay"></div>

        <button id="touch-continue">I have a keyboard</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
